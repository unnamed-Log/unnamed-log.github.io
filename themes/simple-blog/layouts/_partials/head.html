<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16251f">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("simple-blog-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
