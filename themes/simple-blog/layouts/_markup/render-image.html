{{- if .IsBlock -}}
  <figure class="article-figure">
    <img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}" loading="lazy" decoding="async">
    {{- with .Title }}<figcaption>{{ . }}</figcaption>{{ else }}<figcaption>{{ $.PlainText }}</figcaption>{{ end -}}
  </figure>
{{- else -}}
  <img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}" loading="lazy" decoding="async" {{ with .Title }}title="{{ . }}"{{ end }}>
{{- end -}}
